name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline, tests, docs = model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest openpyxl==3.1.5
      - name: Rebuild everything from the generator (deterministic) and fail if anything drifted
        run: |
          ./scripts/build_all.sh
          git diff --stat --exit-code -- . ':(exclude)excel/*.xlsx'   # xlsx carries timestamps; its content is tested
      - name: Tests (rules find every planted problem, model totals, reconciliation to the cent, KPI traceability)
        run: python3 -m pytest -q
      - name: Every number in docs and site = data/metrics.json
        run: python3 scripts/build_docs.py --check
      - name: Links
        run: python3 scripts/check-links.py
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: |
            warehouse/vennaert.sqlite
            data/metrics.json

  powerbi:
    name: Power BI model (TMDL read by Microsoft's serializer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tools/TmdlValidate -- "powerbi/Vennaert Sales.SemanticModel/definition"

  sqlserver:
    name: Same model on SQL Server 2022, same KPIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the warehouse and export it for SQL Server
        run: |
          python3 generator/generate_sources.py
          python3 etl/pipeline.py
          python3 scripts/export_for_sqlserver.py
      - name: Start SQL Server 2022
        run: |
          echo "MSSQL_SA_PASSWORD=Vn-$(openssl rand -hex 12)-A1" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" \
            -v "$PWD/sql/tsql:/sql:ro" -v "$PWD/warehouse/export:/data:ro" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then echo "ready after ${i}x2s"; break; fi
            sleep 2
          done
      - name: Load, create views, compare 17 KPIs with SQLite
        run: python3 scripts/sqlserver_check.py

  excel:
    name: Excel workbook recalculated, every check OK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install formulas openpyxl==3.1.5
      - run: python3 scripts/check_workbook.py
